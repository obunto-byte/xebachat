  <circle r="126" fill="none" stroke="#e43b5a" stroke-opacity=".27" stroke-width="1.5"/>
  <circle r="91" fill="none" stroke="#e43b5a" stroke-opacity=".32" stroke-dasharray="5 7"/>
  <circle r="55" fill="none" stroke="#e43b5a" stroke-opacity=".35"/>
  <path d="M-158 0H158M0-158V158M-112-112L112 112M112-112L-112 112" stroke="#d63855" stroke-opacity=".17"/>
  <path d="M0 0L118-72A138 138 0 0 1 132 40Z" fill="#e52a4e" fill-opacity=".14"/>
  <path d="M0 0L118-72" stroke="#ff6b82" stroke-width="2" stroke-opacity=".85"/>
  <circle r="8" fill="#ff526f"/><circle r="18" fill="none" stroke="#ff526f" stroke-opacity=".5"/>
  <g fill="#ff6b82" stroke="#2b101a" stroke-width="3">
    <circle cx="74" cy="-91" r="7"/><circle cx="-91" cy="-45" r="6"/><circle cx="112" cy="53" r="7"/><circle cx="-34" cy="117" r="6"/><circle cx="24" cy="-126" r="5"/>
  </g>
  <g fill="none" stroke="#f05a73" stroke-width="1.5" stroke-opacity=".75">

    <text x="66" y="21" fill="#ffdce2" font-size="12" text-anchor="middle" font-weight="700" letter-spacing="1.5">PYTHON TOOL</text>
    <rect x="145" width="76" height="31" rx="15" fill="#1a1b24" stroke="#77717c"/>
    <text x="183" y="21" fill="#e5e2e8" font-size="12" text-anchor="middle" font-weight="700">V1.2</text>
    <text x="240" y="21" fill="#a9a6b0" font-size="13">AUTHORIZED ASSESSMENT ONLY</text>
  </g>
</g>
<!-- radar / discovery graphic -->
<g transform="translate(980 210)">

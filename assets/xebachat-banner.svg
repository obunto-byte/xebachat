<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">XEBACHAT v1.2 — Endpoint Discovery</title>
<desc id="desc">A dark crimson cyber security banner featuring a radar scan, shield emblem, and endpoint discovery motifs.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07090e"/><stop offset=".58" stop-color="#111019"/><stop offset="1" stop-color="#260812"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8f102d"/><stop offset=".52" stop-color="#ed294b"/><stop offset="1" stop-color="#ff7184"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#d51e43" stop-opacity=".27"/><stop offset="1" stop-color="#d51e43" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a52a43" stroke-opacity=".16" stroke-width="1"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1280" height="420" rx="22" fill="url(#background)"/>
<rect width="1280" height="420" rx="22" fill="url(#grid)"/>
<ellipse cx="1030" cy="205" rx="300" ry="245" fill="url(#glow)"/>
<path d="M0 34H1280M0 386H1280" stroke="#e52a4e" stroke-opacity=".5"/>
<path d="M0 350H1280" stroke="#f04461" stroke-opacity=".14" stroke-dasharray="4 10"/>
<g font-family="Arial,sans-serif">
  <text x="76" y="68" fill="#f36a7e" font-size="14" font-weight="700" letter-spacing="4">XEBAC SECURITY LABS  /  TOOL SERIES 01</text>
  <text x="70" y="172" fill="#fff" font-size="82" font-weight="900" letter-spacing="5">XEBACHAT</text>
  <rect x="76" y="193" width="480" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="78" y="242" fill="#ff526d" font-size="25" font-weight="700" letter-spacing="4">ENDPOINT DISCOVERY</text>
  <text x="78" y="282" fill="#d5d4dc" font-size="19">URL intelligence  •  Link extraction  •  Structured reports</text>
  <g transform="translate(78 316)">
